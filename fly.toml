# Fly.io alternative:  fly launch --no-deploy  &&  fly deploy
#   fly secrets set GEMINI_API_KEY=...  BRAVE_API_KEY=...
app = "job-source-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  USE_TIER2 = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  # Chromium is memory-hungry; 256MB will OOM on Tier 2.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
